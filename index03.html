<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guess the Number Game</title>
  <link rel="stylesheet" href="style03.css">
</head>
<body>

  <div class="container">
    <h1>🎯 Guess the Secret Number (1 - 10)</h1>
    
    <p><strong>High Score:</strong> <span id="highScore">-</span> attempts</p>
    
    <input type="number" id="guessInput" placeholder="Enter your guess" min="1" max="10">
    <button id="guessBtn">Guess</button>
    <button id="playAgainBtn" style="display:none;">Play Again</button>
    
    <p id="message" class="fade"></p>
  </div>

  <script src="script03.js"></script>
</body>
</html>
